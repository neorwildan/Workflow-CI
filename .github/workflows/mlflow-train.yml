name: MLflow Model Training - Bunga Classification

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow tensorflow numpy matplotlib scikit-learn Pillow opencv-python
        
     - name: Run training
      working-directory: ./MLProject
      run: |
        export MLFLOW_ALLOW_FILE_STORE=true
        python modelling.py
        
    - name: Upload MLflow artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-artifacts
        path: ./MLProject/mlflow_experiments/
        
    - name: Upload model
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: ./MLProject/bunga_classification_model.h5